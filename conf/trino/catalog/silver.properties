# Trino catalog "silver" = silver layer → tables silver.<namespace>.<table> (namespaces base, pii)
# Same settings as bronze.properties, pointing at the silver Iceberg REST catalog.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://iceberg-rest-silver-dungafk:8181
iceberg.rest-catalog.warehouse=s3://lakehouse/silver/
iceberg.file-format=PARQUET

fs.s3.enabled=true
s3.endpoint=http://minio-dungafk:9000
s3.path-style-access=true
s3.aws-access-key=${ENV:MINIO_ROOT_USER}
s3.aws-secret-key=${ENV:MINIO_ROOT_PASSWORD}
s3.region=us-east-1

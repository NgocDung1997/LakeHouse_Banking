# Trino catalog "gold" = gold layer → tables gold.<namespace>.<table> (namespaces common, c360, credit)
# Same settings as silver.properties, pointing at the gold Iceberg REST catalog.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://iceberg-rest-gold-dungafk:8181
iceberg.rest-catalog.warehouse=s3://lakehouse/gold/
iceberg.file-format=PARQUET

fs.s3.enabled=true
s3.endpoint=http://minio-dungafk:9000
s3.path-style-access=true
s3.aws-access-key=${ENV:MINIO_ROOT_USER}
s3.aws-secret-key=${ENV:MINIO_ROOT_PASSWORD}
s3.region=us-east-1

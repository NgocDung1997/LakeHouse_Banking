# Trino catalog "bronze" = bronze layer → tables bronze.<domain>.<table> (Iceberg REST catalog of the layer)
# The catalog name matches the Spark catalog (spark.sql.catalog.bronze). One catalog file per layer.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://iceberg-rest-bronze-dungafk:8181
iceberg.rest-catalog.warehouse=s3://lakehouse/bronze/
iceberg.file-format=PARQUET

# Native S3 filesystem (Trino 400+: use fs.s3.* instead of fs.native-s3.*)
# ${ENV:VAR} is Trino's syntax for reading environment variables in catalog properties
fs.s3.enabled=true
s3.endpoint=http://minio-dungafk:9000
s3.path-style-access=true
s3.aws-access-key=${ENV:MINIO_ROOT_USER}
s3.aws-secret-key=${ENV:MINIO_ROOT_PASSWORD}
s3.region=us-east-1

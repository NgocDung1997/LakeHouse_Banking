# Trino coordinator-only (single-node) — suitable for dev/demo
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080

# Password authentication (users in secrets/password.db, see password-authenticator.properties).
# Trino only accepts passwords over HTTPS → port 8443 with a self-signed cert.
http-server.authentication.type=PASSWORD
http-server.https.enabled=true
http-server.https.port=8443
http-server.https.keystore.path=/etc/trino/secrets/trino.pem
# Required once authentication is enabled (value comes from .env)
internal-communication.shared-secret=${ENV:TRINO_SHARED_SECRET}
# Keep plain HTTP :8080 for the container healthcheck / internal traffic; logins must use HTTPS :8443
http-server.authentication.allow-insecure-over-http=true

# Cap memory to avoid OOM when Spark runs at the same time
query.max-memory-per-node=512MB

# Trino coordinator-only (single-node) — suitable for dev/demo
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080

# No authentication (local lab only): plain HTTP, any user name, no password.
# Exposed on host port 8086 (host 8080 is taken by the Spark Master UI).

# Cap memory to avoid OOM when Spark runs at the same time
query.max-memory-per-node=512MB

# Spark defaults for the lab (mounted into every Spark container)
# Iceberg + JDBC JARs are already baked into lakehouse-spark:3.5.0
# → spark.jars.packages is NOT needed

# --- Cluster -------------------------------------------------------------------
# Without this, spark-submit silently falls back to local[*] (spark-submit does not read
# the SPARK_MASTER_URL env var). --master on the command line still overrides it.
spark.master                                        spark://spark-master-dungafk:7077

# --- Iceberg extensions ------------------------------------------------------
spark.sql.extensions                                org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

# --- Iceberg catalogs: ONE CATALOG PER LAYER ----------------------------------
# Tables are named <layer>.<domain>.<table>, e.g. bronze.t24.account (same name in Trino).
# Each layer has its own Iceberg REST service (and registry database). Add silver / gold the same way later.
spark.sql.catalog.bronze                            org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.bronze.type                       rest
spark.sql.catalog.bronze.uri                        http://iceberg-rest-bronze-dungafk:8181
spark.sql.catalog.bronze.warehouse                  s3://lakehouse/bronze/
# io-impl must be set explicitly: Iceberg uses its own AWS SDK v2, separate from hadoop-aws SDK v1.
# The SDK needs a region even with MinIO. Credentials: AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY env vars.
spark.sql.catalog.bronze.io-impl                    org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.bronze.s3.endpoint                http://minio-dungafk:9000
spark.sql.catalog.bronze.s3.path-style-access       true
spark.sql.catalog.bronze.s3.region                  us-east-1

# Silver layer → silver.<namespace>.<table> (namespaces base, pii)
spark.sql.catalog.silver                            org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.silver.type                       rest
spark.sql.catalog.silver.uri                        http://iceberg-rest-silver-dungafk:8181
spark.sql.catalog.silver.warehouse                  s3://lakehouse/silver/
spark.sql.catalog.silver.io-impl                    org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.silver.s3.endpoint                http://minio-dungafk:9000
spark.sql.catalog.silver.s3.path-style-access       true
spark.sql.catalog.silver.s3.region                  us-east-1

# Gold layer → gold.<namespace>.<table> (namespaces common, c360, credit)
spark.sql.catalog.gold                              org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.gold.type                         rest
spark.sql.catalog.gold.uri                          http://iceberg-rest-gold-dungafk:8181
spark.sql.catalog.gold.warehouse                    s3://lakehouse/gold/
spark.sql.catalog.gold.io-impl                      org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.gold.s3.endpoint                  http://minio-dungafk:9000
spark.sql.catalog.gold.s3.path-style-access         true
spark.sql.catalog.gold.s3.region                    us-east-1

# Write to Iceberg tables BY COLUMN NAME, not by position (schema evolution appends new columns at the end of a
# table; with the default the write fails "... is out of order", known_issues KI-017).
spark.sql.iceberg.check-ordering                    false
# spark.sql.defaultCatalog stays unset: the default is spark_catalog (temp views); Iceberg names are always
# fully qualified, e.g. bronze.crm.customer.

# --- S3A / MinIO (hadoop-aws, AWS SDK v1) ------------------------------------
# Used for direct spark.read/write via s3a:// URIs (outside the Iceberg catalog)
spark.hadoop.fs.s3a.endpoint                        http://minio-dungafk:9000
spark.hadoop.fs.s3a.path.style.access               true
spark.hadoop.fs.s3a.impl                            org.apache.hadoop.fs.s3a.S3AFileSystem
# EnvironmentVariableCredentialsProvider reads AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY from env.
# SimpleAWSCredentialsProvider needs fs.s3a.access.key / secret.key in the conf — not used because
# spark-defaults.conf does not support ${ENV_VAR} variable substitution.
spark.hadoop.fs.s3a.aws.credentials.provider        com.amazonaws.auth.EnvironmentVariableCredentialsProvider

# --- Timezone -----------------------------------------------------------------
spark.sql.session.timeZone                          Asia/Ho_Chi_Minh

# --- Serializer ---------------------------------------------------------------
# JavaSerializer instead of KryoSerializer — avoids Kryo 5.x errors with Iceberg generics
spark.serializer                                    org.apache.spark.serializer.JavaSerializer

# --- Resource limits (IMPORTANT for Docker standalone mode) ------------------
# executor.memory + memoryOverhead = 768 + 256 = 1024m/executor
# cores.max = 1, executor.cores = 1 → each application gets only 1 executor, so a notebook and
# a spark-submit can run side by side on a 2-core worker. Jobs that need more cores should
# add --conf spark.cores.max=2 themselves (like run_jdbc_lab.sh).
# Worker container mem_limit = 3g = 2 executors × 1024m + ~1g worker JVM overhead
spark.executor.memory                               768m
spark.executor.memoryOverhead                       256m
spark.driver.memory                                 512m
spark.driver.memoryOverhead                         256m
spark.executor.cores                                1
spark.cores.max                                     1

# --- Dev performance ----------------------------------------------------------
spark.sql.shuffle.partitions                        4
spark.sql.parquet.compression.codec                 snappy

x-common: &common
  restart: unless-stopped
  env_file:
    - .env
  networks:
    - lakehouse-net-dungafk

# Pass MinIO credentials to the AWS SDK in every Spark container.
# AWS_REGION is required by iceberg-aws-bundle (SDK v2), even though MinIO is not real AWS.
x-spark-env: &spark-env
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  AWS_REGION: ${AWS_REGION}

x-spark-common: &spark-common
  <<: *common
  build:
    context: ./docker/spark
    dockerfile: Dockerfile
  image: lakehouse-spark:3.5.0
  environment:
    <<: *spark-env
  volumes:
    - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf

services:
  # ── Object Storage (B1) ───────────────────────────────
  minio-dungafk:
    <<: *common
    image: bitnamilegacy/minio:2025.5.24-debian-12-r5@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c
    container_name: minio-dungafk
    user: "0:0"
    command: minio server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init-dungafk:
    image: bitnamilegacy/minio-client:2025.5.21-debian-12-r4@sha256:00dcc4e58ada0df45bb7d9ee435af98295f96c27c3c68292ce78ec700a87b511
    container_name: minio-init-dungafk
    depends_on:
      minio-dungafk:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local ${MINIO_ENDPOINT} $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
        mc mb --ignore-existing local/${MINIO_BUCKET};
        mc mb --ignore-existing local/${MINIO_LAB_BUCKET};
        echo 'Buckets ready.';
      "
    restart: "no"
    env_file:
      - .env
    networks:
      - lakehouse-net-dungafk

  # ── Spark Cluster (B1) ────────────────────────────────
  spark-master-dungafk:
    <<: *spark-common
    container_name: spark-master-dungafk
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
    environment:
      <<: *spark-env
      SPARK_MASTER_HOST: spark-master-dungafk
    ports:
      - "8080:8080"
      - "7077:7077"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  spark-worker-dungafk:
    <<: *spark-common
    container_name: spark-worker-dungafk
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - --memory
      - "${SPARK_WORKER_MEM}"
      - --cores
      - "${SPARK_WORKER_CORES}"
      - "${SPARK_MASTER_URL}"
    environment:
      <<: *spark-env
    #mem_limit: ${SPARK_WORKER_MEM_LIMIT}
    ports:
      - "8081:8081"
    depends_on:
      spark-master-dungafk:
        condition: service_healthy

  # ── Database (B2) ─────────────────────────────────────
  # The single Postgres instance for the whole course. wal_level=logical so Debezium
  # can use it in B9, and so B2 can inspect the WAL without a restart.
  postgres-dungafk:
    <<: *common
    image: postgres:15-alpine
    container_name: postgres-dungafk
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=5"
      - "-c"
      - "max_wal_senders=5"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-data/postgres:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MySQL Source (LOS — Loan Origination System) ──────
  mysql-dungafk:
    <<: *common
    image: mysql:8.4.13@sha256:8c233bad33d520a7aae1c1e619c3a9775f4a1ba2d463d692fada04ec7f40be00
    container_name: mysql-dungafk
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_0900_ai_ci"
      - "--default-time-zone=+07:00"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-data/mysql:/docker-entrypoint-initdb.d:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 35s

  # ── Spark Client (B4) ─────────────────────────────────
  # spark-client-dungafk: exec into this container to run spark-submit
  spark-client-dungafk:
    <<: *common
    build:
      context: ./docker/jupyter
      dockerfile: Dockerfile
    image: lakehouse-jupyter:3.5.0-jlab4.3.8
    container_name: spark-client-dungafk
    command: ["bash", "-c", "tail -f /dev/null"]
    environment:
      <<: *spark-env
    ports:
      - "4040:4040"   # Spark Application UI — only active while a job is running
    volumes:
      - ./jobs:/home/spark/jobs            # Project jobs (e.g. jobs/bronze)
      - ./logs:/home/spark/logs            # Job run / error logs (e.g. logs/bronze/errors.log), git-ignored
      - ./secrets:/home/spark/secrets:ro   # SSH private keys for SFTP ingestion, git-ignored
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
    depends_on:
      spark-master-dungafk:
        condition: service_healthy

  # ── Jupyter Notebook (B3) ─────────────────────────────
  jupyter-dungafk:
    <<: *common
    build:
      context: ./docker/jupyter
      dockerfile: Dockerfile
    image: lakehouse-jupyter:3.5.0-jlab4.3.8
    container_name: jupyter-dungafk
    ports:
      - "8888:8888"
      - "4041:4040"   # Notebook Spark UI — host port 4040 is taken by spark-client
    environment:
      <<: *spark-env   # SPARK_MASTER_URL, MINIO_ENDPOINT come from env_file (.env)
    volumes:
      - ./jobs:/home/spark/jobs
      - ./notebooks:/opt/notebooks
      - ./secrets:/home/spark/secrets:ro
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
      - ./docker/jupyter/startup/00_init_spark.py:/home/spark/.ipython/profile_default/startup/00_init_spark.py:ro
    depends_on:
      spark-master-dungafk:
        condition: service_healthy

  # ── Iceberg REST Catalog (B5) ─────────────────────────
  # One Iceberg REST catalog per layer: Spark / Trino catalog "bronze" → tables bronze.<domain>.<table>.
  # Each layer has its own service + registry database (bronze, silver; gold later, same block).
  iceberg-rest-bronze-dungafk:
    <<: *common
    image: tabulario/iceberg-rest:1.6.0
    container_name: iceberg-rest-bronze-dungafk
    ports:
      - "8181:8181"
    environment:
      CATALOG_WAREHOUSE: s3://${MINIO_BUCKET}/bronze/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: ${MINIO_ENDPOINT}
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: ${AWS_REGION}
      # JDBC backend — persist the catalog registry in Postgres instead of in-memory, in the layer's own
      # database ICEBERG_BRONZE_CATALOG_DB (not the banking source DB POSTGRES_DB).
      # Without these 4 lines, every table disappears after each container restart.
      CATALOG_CATALOG__IMPL: org.apache.iceberg.jdbc.JdbcCatalog
      CATALOG_URI: jdbc:postgresql://postgres-dungafk:5432/${ICEBERG_BRONZE_CATALOG_DB}
      CATALOG_JDBC_USER: ${POSTGRES_USER}
      CATALOG_JDBC_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      minio-dungafk:
        condition: service_healthy
      postgres-dungafk:
        condition: service_healthy

  # Silver layer: Spark / Trino catalog "silver" → tables silver.<namespace>.<table> (namespaces base, pii)
  iceberg-rest-silver-dungafk:
    <<: *common
    image: tabulario/iceberg-rest:1.6.0
    container_name: iceberg-rest-silver-dungafk
    ports:
      - "8182:8181"   # host 8181 is taken by the bronze catalog
    environment:
      CATALOG_WAREHOUSE: s3://${MINIO_BUCKET}/silver/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: ${MINIO_ENDPOINT}
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: ${AWS_REGION}
      CATALOG_CATALOG__IMPL: org.apache.iceberg.jdbc.JdbcCatalog
      CATALOG_URI: jdbc:postgresql://postgres-dungafk:5432/${ICEBERG_SILVER_CATALOG_DB}
      CATALOG_JDBC_USER: ${POSTGRES_USER}
      CATALOG_JDBC_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      minio-dungafk:
        condition: service_healthy
      postgres-dungafk:
        condition: service_healthy

  # ── Trino (B5) ────────────────────────────────────────
  trino-dungafk:
    <<: *common
    image: trinodb/trino:481
    container_name: trino-dungafk
    ports:
      - "8086:8080"   # Plain HTTP, no authentication — host 8080 is taken by the Spark Master UI
    environment:
      # Trino config files read these variables via ${ENV:...}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    mem_limit: ${TRINO_MEM_LIMIT}
    volumes:
      - ./conf/trino/config.properties:/etc/trino/config.properties:ro
      - ./conf/trino/jvm.config:/etc/trino/jvm.config:ro
      - ./conf/trino/node.properties:/etc/trino/node.properties:ro
      - ./conf/trino/catalog:/etc/trino/catalog:ro
    healthcheck:
      test: ["CMD", "/usr/lib/trino/bin/health-check"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    depends_on:
      iceberg-rest-bronze-dungafk:
        condition: service_started
      iceberg-rest-silver-dungafk:
        condition: service_started

volumes:
  minio_data:
  postgres_data:
  mysql_data:

networks:
  lakehouse-net-dungafk:
    driver: bridge
    name: lakehouse-net-dungafk

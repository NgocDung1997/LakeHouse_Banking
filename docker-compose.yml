# ═══════════════════════════════════════════════════════
#  PHASE 1 — Foundation & Big Data Core
#  Sessions: B1, B2, B3, B4, B5
#  Services: MinIO, Postgres, Iceberg REST, Trino,
#            Spark (master/worker/client), Jupyter
# ═══════════════════════════════════════════════════════
#  Usage (chạy từ lab/phase1-b1-b5/, file .env có sẵn trong thư mục):
#    docker compose build spark-master-cole
#    docker compose build jupyter-cole
#
#  Bật toàn bộ Phase 1 một lần (dùng cho cả B1–B5):
#    docker compose up -d
#
#  Dừng:
#    docker compose down        # giữ dữ liệu
#    docker compose down -v     # xóa cả volume
# ═══════════════════════════════════════════════════════

x-common: &common
  restart: unless-stopped
  env_file:
    - .env
  networks:
    - lakehouse-net-cole

# Truyền MinIO credentials vào AWS SDK cho tất cả Spark containers.
# AWS_REGION bắt buộc cho iceberg-aws-bundle (SDK v2), dù là MinIO không phải AWS thật.
x-spark-env: &spark-env
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  AWS_REGION: ${AWS_REGION}

x-spark-common: &spark-common
  <<: *common
  build:
    context: ./docker/spark
    dockerfile: Dockerfile
  image: lakehouse-spark:3.5.0
  environment:
    <<: *spark-env
  volumes:
    - ../job_code:/opt/spark/job_code
    - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf

services:
  # ── Object Storage (B1) ───────────────────────────────
  minio-cole:
    <<: *common
    image: bitnamilegacy/minio:2025.5.24-debian-12-r5@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c
    container_name: minio-cole
    user: "0:0"
    command: minio server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init-cole:
    image: bitnamilegacy/minio-client:2025.5.21-debian-12-r4@sha256:00dcc4e58ada0df45bb7d9ee435af98295f96c27c3c68292ce78ec700a87b511
    container_name: minio-init-cole
    depends_on:
      minio-cole:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local ${MINIO_ENDPOINT} $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
        mc mb --ignore-existing local/${MINIO_BUCKET};
        mc mb --ignore-existing local/${MINIO_LAB_BUCKET};
        echo 'Buckets ready.';
      "
    restart: "no"
    env_file:
      - .env
    networks:
      - lakehouse-net-cole

  # ── Spark Cluster (B1) ────────────────────────────────
  spark-master-cole:
    <<: *spark-common
    container_name: spark-master-cole
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
    environment:
      <<: *spark-env
      SPARK_MASTER_HOST: spark-master-cole
    ports:
      - "8080:8080"
      - "7077:7077"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  spark-worker-cole:
    <<: *spark-common
    container_name: spark-worker-cole
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - --memory
      - "${SPARK_WORKER_MEM}"
      - --cores
      - "${SPARK_WORKER_CORES}"
      - "${SPARK_MASTER_URL}"
    environment:
      <<: *spark-env
    mem_limit: ${SPARK_WORKER_MEM_LIMIT}
    ports:
      - "8081:8081"
    depends_on:
      spark-master-cole:
        condition: service_healthy

  # ── Database (B2) ─────────────────────────────────────
  # Postgres duy nhất của toàn khóa. wal_level=logical để Debezium dùng được ở B9
  # và để B2 quan sát WAL mà không cần restart.
  postgres-cole:
    <<: *common
    image: postgres:15-alpine
    container_name: postgres-cole
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=5"
      - "-c"
      - "max_wal_senders=5"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-sql/postgres:/docker-entrypoint-initdb.d:ro
      - ./labs/b2-database/sql:/labs/b2:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Spark Client (B4) ─────────────────────────────────
  # spark-client-cole: học viên exec vào đây để chạy spark-submit
  spark-client-cole:
    <<: *common
    build:
      context: ./docker/jupyter
      dockerfile: Dockerfile
    image: lakehouse-jupyter:3.5.0-jlab4.3.8
    container_name: spark-client-cole
    command: ["bash", "-c", "tail -f /dev/null"]
    environment:
      <<: *spark-env
    ports:
      - "4040:4040"   # Spark Application UI — chỉ active khi job đang chạy
    volumes:
      - ../job_code:/home/spark/job_code
      - ./jobs:/home/spark/jobs   # Chỗ học viên đặt job của riêng mình
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
    depends_on:
      spark-master-cole:
        condition: service_healthy

  # ── Jupyter Notebook (B3) ─────────────────────────────
  jupyter-cole:
    <<: *common
    build:
      context: ./docker/jupyter
      dockerfile: Dockerfile
    image: lakehouse-jupyter:3.5.0-jlab4.3.8
    container_name: jupyter-cole
    ports:
      - "8888:8888"
      - "4041:4040"   # Spark UI của notebook — 4040 trên host đã dành cho spark-client
    environment:
      <<: *spark-env
      SPARK_MASTER_URL: ${SPARK_MASTER_URL}
      ICEBERG_CATALOG_URI: ${ICEBERG_CATALOG_URI}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
    volumes:
      - ../job_code:/home/spark/job_code
      - ./notebooks:/opt/notebooks
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
      - ./docker/jupyter/startup/00_init_spark.py:/home/spark/.ipython/profile_default/startup/00_init_spark.py:ro
    depends_on:
      spark-master-cole:
        condition: service_healthy

  # ── Iceberg REST Catalog (B5) ─────────────────────────
  iceberg-rest-cole:
    <<: *common
    image: tabulario/iceberg-rest:1.6.0
    container_name: iceberg-rest-cole
    ports:
      - "8181:8181"
    environment:
      CATALOG_WAREHOUSE: s3://${MINIO_BUCKET}/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: ${MINIO_ENDPOINT}
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: ${AWS_REGION}
      # JDBC backend — lưu catalog registry vào Postgres thay vì in-memory.
      # Không có 4 dòng này: mọi bảng biến mất sau mỗi lần restart container.
      CATALOG_CATALOG__IMPL: org.apache.iceberg.jdbc.JdbcCatalog
      CATALOG_URI: jdbc:postgresql://postgres-cole:5432/${POSTGRES_DB}
      CATALOG_JDBC_USER: ${POSTGRES_USER}
      CATALOG_JDBC_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      minio-cole:
        condition: service_healthy
      postgres-cole:
        condition: service_healthy

  # ── Trino (B5) ────────────────────────────────────────
  trino-cole:
    <<: *common
    image: trinodb/trino:481
    container_name: trino-cole
    ports:
      - "8085:8080"   # 8080 trên host đã dành cho Spark Master UI
    environment:
      # Catalog lakehouse.properties đọc các biến này bằng ${ENV:...}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    mem_limit: ${TRINO_MEM_LIMIT}
    volumes:
      - ./conf/trino/config.properties:/etc/trino/config.properties:ro
      - ./conf/trino/jvm.config:/etc/trino/jvm.config:ro
      - ./conf/trino/node.properties:/etc/trino/node.properties:ro
      - ./conf/trino/catalog:/etc/trino/catalog:ro
      - ./trino-views:/opt/trino-views:ro
    healthcheck:
      test: ["CMD", "/usr/lib/trino/bin/health-check"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    depends_on:
      iceberg-rest-cole:
        condition: service_started

volumes:
  minio_data:
  postgres_data:

networks:
  lakehouse-net-cole:
    driver: bridge
    name: lakehouse-net-cole
